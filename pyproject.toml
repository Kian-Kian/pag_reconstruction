[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pag-reconstruction"
version = "0.1.0"
description = "Physics-informed residual learning and graph partitioning for prior-austenite grain reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "torch>=2.6,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["pag_recon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
